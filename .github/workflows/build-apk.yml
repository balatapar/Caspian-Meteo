name: Build Flet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev mesa-utils ninja-build pkg-config clang cmake

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Build APK with Flet (split per ABI)
        run: |
          # Patch flet-charts pubspec before build
          python scripts/patch_flet_charts_pubspec.py
          
          # Build one APK per ABI (arm64-v8a, armeabi-v7a, x86_64)
          # Official Flet flag, see https://flet.dev/docs/publish/android#split-apk-per-abi
          yes | flet build apk --verbose --split-per-abi
          
          # Verify: with --split-per-abi there must be 3 APKs in build/apk/
          echo "Generated APKs:"
          ls -lh build/apk/
          APK_COUNT=$(ls build/apk/*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK not found in build/apk/ after build."
            exit 1
          fi
          echo "Found $APK_COUNT APK file(s)."

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: CaspianWeather-APK
          path: build/apk/*.apk

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: CaspianWeather ${{ github.sha }}
          body: |
            Automated split-per-ABI APK build from commit ${{ github.sha }}.

            Download the APK matching your device (each ~60MB instead of one 182MB universal APK):

            - `CaspianFlow-arm64-v8a.apk` — most modern phones (recommended)
            - `CaspianFlow-armeabi-v7a.apk` — older 32-bit phones
            - `CaspianFlow-x86_64.apk` — emulators
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
